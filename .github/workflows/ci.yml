name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "step-*"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Overall job timeout
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: |
          bin/rails db:create
          if [ -f db/schema.rb ]; then
            bin/rails db:schema:load
          else
            bin/rails db:migrate
          fi
          bin/rails db:test:prepare

      - name: Run unit tests
        env:
          RAILS_ENV: test
        timeout-minutes: 2  # Unit tests should be fast
        run: bin/rails test

      - name: Run system tests
        env:
          RAILS_ENV: test
          DISABLE_SPRING: 1  # Spring can cause issues in CI
        timeout-minutes: 5  # System tests get more time
        run: |
          # Run drawer tests individually (they need isolation due to shared dialog state)
          # Run other system tests in batches for better performance
          echo "Running drawer tests (isolated)..."
          find test/system/dashboard/drawer -name '*_test.rb' | \
            xargs -n 1 bin/rails test
          
          echo "Running other system tests (batched)..."
          find test/system/ -name '*_test.rb' \
            ! -path '*/dashboard/drawer/*' \
            ! -path '*/auth/sign_in_sign_out_mobile_test.rb' \
            ! -path '*/stimulus/components/alert_auto_close_test.rb' \
            ! -path '*/shared/flash_messages_drawer_click_close_test.rb' | \
            xargs -n 5 bin/rails test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
